spring.application.name=backend
spring.devtools.restart.enabled=true

spring.jpa.hibernate.ddl-auto=update

# 本番環境ではuseSSLをtrueに変更すること
spring.datasource.url=jdbc:mysql://mysql:3306/tuna_db?allowPublicKeyRetrieval=true&useSSL=true
spring.datasource.username=user
spring.datasource.password=pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.security.user.name=root
spring.security.user.password=pass
spring.data.mongodb.uri=mongodb://root:password@mongo:27017/tuna_mongodb?authSource=admin



server.servlet.context-path=/api

# frontend url
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# AWS General
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}
cloud.aws.region=${AWS_REGION:}
cloud.aws.s3.bucket=${AWS_S3_BUCKET_NAME:}

# ファイルサイズ上限
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

#Redis接続
spring.data.redis.host=localhost
spring.data.redis.password=
spring.data.redis.port=6379