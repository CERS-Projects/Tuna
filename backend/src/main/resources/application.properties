spring.application.name=backend
spring.devtools.restart.enabled=true

spring.jpa.hibernate.ddl-auto=update

# 本番環境ではuseSSLをtrueに変更すること
spring.datasource.url=jdbc:mysql://mysql:3306/tuna_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=user
spring.datasource.password=pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.security.user.name=root
spring.security.user.password=pass
spring.data.mongodb.uri=mongodb://root:password@mongo:27017/tuna_mongodb?authSource=admin



server.servlet.context-path=/api

# frontend url
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# AWS General
aws.access-key-id=${AWS_ACCESS_KEY_ID:test-access-key}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:test-secret-key}
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:test-access-key}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:test-secret-key}
cloud.aws.region=${AWS_REGION:ap-northeast-1}
cloud.aws.s3.bucket=${AWS_S3_BUCKET_NAME:test-bucket}

# ファイルサイズ上限
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB